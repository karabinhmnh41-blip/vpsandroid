name: Cloud Android Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: vps-android-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 320

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pull & Start Light Android Container
        run: |
          docker pull budtmo/docker-android:emulator_9.0
          docker run -d --name android \
            --device /dev/kvm \
            --privileged \
            -p 6080:6080 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e WEB_VNC=true \
            -e DEVICE_FRAME=false \
            -e EMULATOR_NO_SKIN=true \
            -e EMULATOR_HEADLESS=true \
            -e EMULATOR_ARGS="-memory 1536 -cores 2 -gpu off -no-audio -no-snapshot-save -no-boot-anim" \
            budtmo/docker-android:emulator_9.0

      - name: Wait for Web VNC Service (Port 6080)
        run: |
          echo "⏳ Đang chờ Web VNC Android phản hồi..."
          for i in $(seq 1 40); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6080/vnc.html || true)
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "✅ Web VNC Port 6080 đã sẵn sàng (HTTP $HTTP_STATUS)!"
              break
            fi
            echo "Chờ noVNC Android khởi động ($i/40)... status: $HTTP_STATUS"
            sleep 4
          done

      - name: Install Cloudflared & Tunnel
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate --protocol http2 --logfile cloudflared.log &
          sleep 12

      - name: Export Link
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1)
          FULL="$URL/vnc.html?autoconnect=true&resize=scale"
          
          echo "### 🚀 LINK MỞ ANDROID EMULATOR:" >> $GITHUB_STEP_SUMMARY
          echo "[CLICK ĐỂ MỞ ANDROID EMULATOR]($FULL)" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "$FULL" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

          echo "$FULL" > android-link.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add android-link.txt
          git commit -m "Update Cloud Android link" || true
          git push origin main --force

      - name: Keep Alive (5h)
        run: sleep 18000
