name: Cloud Android 9 Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: vps-android-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 320

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup 2GB Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 2G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pull & Start Android 9 Image
        run: |
          docker pull budtmo/docker-android:emulator_9.0
          mkdir -p "$GITHUB_WORKSPACE/android-data"
          docker run -d --name android \
            --privileged \
            --device /dev/kvm \
            -p 6080:6080 \
            -p 4723:4723 \
            -p 5554:5554 \
            -p 5555:5555 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e WEB_VNC=true \
            -e DEVICE_FRAME=false \
            -v "$GITHUB_WORKSPACE/android-data:/data" \
            budtmo/docker-android:emulator_9.0

      - name: Wait for Web VNC Service (Port 6080)
        run: |
          echo "⏳ Đang chờ Android 9 & Web VNC khởi động dịch vụ..."
          READY=false
          for i in $(seq 1 60); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:6080/ || true)
            if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "302" ]; then
              echo "✅ Web VNC Port 6080 đã sẵn sàng! (Mã HTTP $HTTP_STATUS)"
              READY=true
              break
            fi
            echo "Chờ noVNC khởi động ($i/60)... HTTP Status: $HTTP_STATUS"
            sleep 5
          done

          if [ "$READY" = "false" ]; then
            echo "❌ Quá thời gian chờ. Kiểm tra log Docker:"
            docker logs --tail 40 android
            exit 1
          fi

      - name: Install Cloudflared & Tunnel
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate --protocol http2 --logfile cloudflared.log &
          sleep 12

      - name: Export Link
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1)
          
          echo "### 🚀 LINK MỞ ANDROID 9:" >> $GITHUB_STEP_SUMMARY
          echo "[CLICK ĐỂ MỞ ANDROID EMULATOR]($URL)" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          echo "$URL" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY

          echo "$URL" > android-link.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add android-link.txt
          git commit -m "Update Cloud Android 9 link" || true
          git push origin main --force

      - name: Keep Alive (5h)
        run: sleep 18000
