name: Cloud Android 9 Auto Run (Max Performance & Fixed Render)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: vps-android-runner
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 320

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Up Maximum Disk & RAM Space
        run: |
          echo "🧹 Đang dọn dẹp tối đa dung lượng đĩa và bộ nhớ thừa..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune -a -f || true

      - name: Setup 8GB Swap Space (Max RAM Boost)
        run: |
          echo "🚀 Cấu hình 8GB Swap RAM và tối ưu hóa bộ nhớ..."
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          sudo sysctl vm.swappiness=10
          sudo sysctl vm.vfs_cache_pressure=50

      - name: Enable KVM Hardware Virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pull & Start Android 9 Image (Max Specs + Render Safe)
        run: |
          docker pull budtmo/docker-android:emulator_9.0
          mkdir -p "$GITHUB_WORKSPACE/android-data"

          # Ép tham số Max Performance: 4 Cores, 4GB RAM cho giả lập, độ phân giải chuẩn 720x1280 (320dpi)
          docker run -d --name android \
            --privileged \
            --device /dev/kvm \
            --memory=6144m \
            -p 6080:6080 \
            -p 4723:4723 \
            -p 5554:5554 \
            -p 5555:5555 \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e WEB_VNC=true \
            -e DEVICE_FRAME=false \
            -e SCREEN_WIDTH=720 \
            -e SCREEN_HEIGHT=1280 \
            -e SCREEN_DEPTH=24 \
            -e EMULATOR_ARGS="-memory 4096 -cores 4 -gpu off -no-audio -no-snapshot-save -no-boot-anim -lcd-density 320 -qemu -m 4096" \
            -v "$GITHUB_WORKSPACE/android-data:/data" \
            budtmo/docker-android:emulator_9.0

      - name: Wait for Android System & GUI Boot
        run: |
          echo "⏳ Đang chờ Android nạp xong giao diện màn hình chính..."
          for i in $(seq 1 60); do
            BOOT_CHECK=$(docker exec android adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$BOOT_CHECK" = "1" ]; then
              echo "✅ Android 9 đã nạp xong toàn bộ UI mượt mà!"
              break
            fi
            echo "Đang khởi tạo Android ($i/60)..."
            sleep 5
          done

      - name: Install Cloudflared & Tunnel (HTTP2 Accelerated)
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          nohup cloudflared tunnel --url http://localhost:6080 --no-autoupdate --protocol http2 --logfile cloudflared.log &
          sleep 5

      - name: Export Link
        run: |
          URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' cloudflared.log | head -1)
          
          echo "### 🚀 LINK MỞ ANDROID 9 (MAX PERFORMANCE & FIXED RENDER):" >> $GITHUB_STEP_SUMMARY
          echo "[CLICK ĐỂ MỞ ANDROID EMULATOR]($URL)" >> $GITHUB_STEP_SUMMARY

          echo "$URL" > android-link.txt
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add android-link.txt
          git commit -m "Update Cloud Android 9 link [Max Performance Fixed]" || true
          git push origin main --force

      - name: Keep Alive (5h)
        run: sleep 18000
