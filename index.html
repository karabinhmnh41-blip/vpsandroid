<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android 9 Cloud Controller</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 20px; font-size: 1.4rem; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; font-weight: 500; }
        input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.9rem; outline: none; transition: 0.2s; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; padding: 12px; border-radius: 6px; border: none; color: white; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
        .btn-run { background: #0284c7; }
        .btn-run:hover { background: #0369a1; }
        .btn-clear { background: #e11d48; }
        .btn-clear:hover { background: #be123c; }
        button:disabled { background: #475569 !important; cursor: not-allowed; }
        #status { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 0.85rem; display: none; text-align: center; line-height: 1.4; }
        .info { background: #1e3a8a; color: #bfdbfe; border: 1px solid #1d4ed8; }
        .success { background: #065f46; color: #a7f3d0; border: 1px solid #047857; }
        .error { background: #881337; color: #fecdd3; border: 1px solid #be123c; }
        #link-box { margin-top: 20px; display: none; background: #0f172a; padding: 16px; border-radius: 8px; border: 1px dashed #38bdf8; text-align: center; }
        #link-box a { color: #38bdf8; word-break: break-all; font-weight: bold; font-size: 1.05rem; text-decoration: none; display: inline-block; margin-top: 6px; }
        #link-box a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Android 9 Cloud Controller</h2>
    
    <div class="form-group">
        <label for="token">🔑 GitHub Token (PAT):</label>
        <input type="password" id="token" placeholder="Dán ghp_xxxxxxxxxxxxxx vào đây">
    </div>

    <div class="form-group">
        <label for="owner">👤 GitHub Username:</label>
        <input type="text" id="owner" placeholder="Ví dụ: karabinhmnh41-blip">
    </div>

    <div class="form-group">
        <label for="repo">📁 Repository Name:</label>
        <input type="text" id="repo" placeholder="Ví dụ: vpsandroid">
    </div>

    <div class="form-group">
        <label for="workflow">📄 Workflow File Name:</label>
        <input type="text" id="workflow" value="main.yml" placeholder="main.yml">
    </div>

    <div class="btn-group">
        <button id="start-btn" class="btn-run" onclick="startWorkflow()">Run Workflow & Lấy Link</button>
        <button id="clear-btn" class="btn-clear" onclick="manualClearFile()">🧹 Clear Link File</button>
    </div>

    <div id="status"></div>

    <div id="link-box">
        <div style="font-size: 0.8rem; color: #94a3b8;">LINK MỞ WEB VNC ANDROID 9 MỚI:</div>
        <a id="vnc-url" href="#" target="_blank">Đang cập nhật...</a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if(localStorage.getItem("gh_token")) document.getElementById("token").value = localStorage.getItem("gh_token");
        if(localStorage.getItem("gh_owner")) document.getElementById("owner").value = localStorage.getItem("gh_owner");
        if(localStorage.getItem("gh_repo")) document.getElementById("repo").value = localStorage.getItem("gh_repo");
        if(localStorage.getItem("gh_workflow")) document.getElementById("workflow").value = localStorage.getItem("gh_workflow");
    });

    function showStatus(text, type) {
        const el = document.getElementById("status");
        el.className = type;
        el.innerText = text;
        el.style.display = "block";
    }

    function getInputs() {
        const token = document.getElementById("token").value.trim();
        const owner = document.getElementById("owner").value.trim();
        const repo = document.getElementById("repo").value.trim();
        const workflow = document.getElementById("workflow").value.trim();
        if(!token || !owner || !repo || !workflow) {
            alert("Vui lòng điền đầy đủ các thông tin!");
            return null;
        }
        localStorage.setItem("gh_token", token);
        localStorage.setItem("gh_owner", owner);
        localStorage.setItem("gh_repo", repo);
        localStorage.setItem("gh_workflow", workflow);
        return { token, owner, repo, workflow };
    }

    // Hàm gọi API GitHub xóa file android-link.txt ở main root
    async function clearFileOnRoot(owner, repo, token) {
        let sha = "";
        const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/android-link.txt`, {
            headers: { "Authorization": `Bearer ${token}` }
        });

        if (getRes.ok) {
            const fileData = await getRes.json();
            sha = fileData.sha;
        }

        const bodyData = {
            message: "Reset android-link.txt on main root",
            content: "Q0xFQVJJTkc=", // Base64 của chữ "CLEARING"
            branch: "main"
        };
        if (sha) bodyData.sha = sha;

        const putRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/android-link.txt`, {
            method: "PUT",
            headers: {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(bodyData)
        });

        if (!putRes.ok) {
            const errJson = await putRes.json();
            throw new Error(`Lỗi Clear File: ${errJson.message || putRes.statusText}`);
        }
    }

    // Nút Clear thủ công
    async function manualClearFile() {
        const data = getInputs();
        if(!data) return;

        const clearBtn = document.getElementById("clear-btn");
        const startBtn = document.getElementById("start-btn");
        clearBtn.disabled = true;
        startBtn.disabled = true;
        document.getElementById("link-box").style.display = "none";

        showStatus("🧹 Đang gửi lệnh xóa nội dung android-link.txt trên GitHub...", "info");

        try {
            await clearFileOnRoot(data.owner, data.repo, data.token);
            showStatus("✅ Đã xóa link cũ trên root main thành công! File hiện có nội dung: CLEARING", "success");
        } catch (err) {
            showStatus(`❌ Không thể xóa file: ${err.message}. Kiểm tra Token xem đã tích quyền 'repo' chưa!`, "error");
        } finally {
            clearBtn.disabled = false;
            startBtn.disabled = false;
        }
    }

    // Nút Run Workflow
    async function startWorkflow() {
        const data = getInputs();
        if(!data) return;

        const startBtn = document.getElementById("start-btn");
        const clearBtn = document.getElementById("clear-btn");
        startBtn.disabled = true;
        clearBtn.disabled = true;

        const linkBox = document.getElementById("link-box");
        const vncUrl = document.getElementById("vnc-url");
        linkBox.style.display = "none";
        vncUrl.href = "#";
        vncUrl.innerText = "";
        
        showStatus("🧹 Đang dọn dẹp file android-link.txt trên root...", "info");

        try {
            await clearFileOnRoot(data.owner, data.repo, data.token);
        } catch (e) {
            console.warn("Bỏ qua lỗi clear file, tiếp tục trigger:", e);
        }

        showStatus("⏳ Đang kích hoạt Workflow trên GitHub...", "info");

        try {
            const dispatchRes = await fetch(`https://api.github.com/repos/${data.owner}/${data.repo}/actions/workflows/${data.workflow}/dispatches`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${data.token}`,
                    "Accept": "application/vnd.github+json"
                },
                body: JSON.stringify({ ref: "main" })
            });

            if (!dispatchRes.ok) {
                throw new Error(`Lỗi kích hoạt (Mã ${dispatchRes.status}): Kiểm tra lại Token hoặc Tên Repo.`);
            }

            showStatus("✅ Đã kích hoạt! Đang chờ Android 9 boot & cập nhật link mới...", "info");

            let attempts = 0;
            const maxAttempts = 35;

            const checkInterval = setInterval(async () => {
                attempts++;
                showStatus(`⏳ Đang chờ link mới từ Android 9 (Lần ${attempts}/${maxAttempts})... Chờ khoảng 2-3 phút.`, "info");

                try {
                    const rawRes = await fetch(`https://raw.githubusercontent.com/${data.owner}/${data.repo}/main/android-link.txt?t=${Date.now()}`);
                    if (rawRes.ok) {
                        const link = (await rawRes.text()).trim();
                        if (link && link.startsWith("http") && !link.includes("CLEARING")) {
                            clearInterval(checkInterval);
                            showStatus("🎉 Android 9 đã sẵn sàng!", "success");
                            
                            vncUrl.href = link;
                            vncUrl.innerText = link;
                            linkBox.style.display = "block";
                            startBtn.disabled = false;
                            clearBtn.disabled = false;
                        }
                    }
                } catch (e) {
                    console.log("Đang chờ link...");
                }

                if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    showStatus("⚠️ Quá thời gian chờ. Hãy kiểm tra lại tab Actions trên GitHub.", "error");
                    startBtn.disabled = false;
                    clearBtn.disabled = false;
                }
            }, 15000);

        } catch (err) {
            showStatus(err.message, "error");
            startBtn.disabled = false;
            clearBtn.disabled = false;
        }
    }
</script>

</body>
</html>
