<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android Cloud Runner Controller</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; margin-bottom: 20px; font-size: 1.4rem; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; font-weight: 500; }
        input { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.9rem; outline: none; transition: 0.2s; }
        input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #0369a1; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 0.85rem; display: none; text-align: center; line-height: 1.4; }
        .info { background: #1e3a8a; color: #bfdbfe; border: 1px solid #1d4ed8; }
        .success { background: #065f46; color: #a7f3d0; border: 1px solid #047857; }
        .error { background: #881337; color: #fecdd3; border: 1px solid #be123c; }
        #link-box { margin-top: 20px; display: none; background: #0f172a; padding: 16px; border-radius: 8px; border: 1px dashed #38bdf8; text-align: center; }
        #link-box a { color: #38bdf8; word-break: break-all; font-weight: bold; font-size: 1.05rem; text-decoration: none; display: inline-block; margin-top: 6px; }
        #link-box a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Android 9 Cloud Controller</h2>
    
    <div class="form-group">
        <label for="token">🔑 GitHub Token (PAT):</label>
        <input type="password" id="token" placeholder="Dán ghp_xxxxxxxxxxxxxx vào đây">
    </div>

    <div class="form-group">
        <label for="owner">👤 GitHub Username:</label>
        <input type="text" id="owner" placeholder="Tên tài khoản GitHub">
    </div>

    <div class="form-group">
        <label for="repo">📁 Repository Name:</label>
        <input type="text" id="repo" placeholder="Tên repo chứa workflow">
    </div>

    <div class="form-group">
        <label for="workflow">📄 Workflow File Name:</label>
        <input type="text" id="workflow" value="android.yml" placeholder="android.yml">
    </div>

    <button id="start-btn" onclick="startWorkflow()">Run Workflow & Lấy Link</button>

    <div id="status"></div>

    <div id="link-box">
        <div style="font-size: 0.8rem; color: #94a3b8;">LINK MỞ WEB VNC ANDROID 9:</div>
        <a id="vnc-url" href="#" target="_blank">Đang cập nhật...</a>
    </div>
</div>

<script>
    // Tự động load dữ liệu đã lưu từ trước
    document.addEventListener("DOMContentLoaded", () => {
        if(localStorage.getItem("gh_token")) document.getElementById("token").value = localStorage.getItem("gh_token");
        if(localStorage.getItem("gh_owner")) document.getElementById("owner").value = localStorage.getItem("gh_owner");
        if(localStorage.getItem("gh_repo")) document.getElementById("repo").value = localStorage.getItem("gh_repo");
        if(localStorage.getItem("gh_workflow")) document.getElementById("workflow").value = localStorage.getItem("gh_workflow");
    });

    function showStatus(text, type) {
        const el = document.getElementById("status");
        el.className = type;
        el.innerText = text;
        el.style.display = "block";
    }

    async function startWorkflow() {
        const token = document.getElementById("token").value.trim();
        const owner = document.getElementById("owner").value.trim();
        const repo = document.getElementById("repo").value.trim();
        const workflow = document.getElementById("workflow").value.trim();
        const btn = document.getElementById("start-btn");

        if(!token || !owner || !repo || !workflow) {
            alert("Vui lòng điền đầy đủ các thông tin!");
            return;
        }

        // Lưu thông tin vào trình duyệt
        localStorage.setItem("gh_token", token);
        localStorage.setItem("gh_owner", owner);
        localStorage.setItem("gh_repo", repo);
        localStorage.setItem("gh_workflow", workflow);

        btn.disabled = true;
        document.getElementById("link-box").style.display = "none";
        showStatus("⏳ Đang gửi lệnh kích hoạt (dispatch) tới GitHub...", "info");

        try {
            // 1. Kích hoạt Workflow qua GitHub API
            const dispatchRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/${workflow}/dispatches`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github+json"
                },
                body: JSON.stringify({ ref: "main" })
            });

            if (!dispatchRes.ok) {
                throw new Error(`Lỗi kích hoạt (Mã ${dispatchRes.status}): Kiểm tra lại Token hoặc thông tin Repo.`);
            }

            showStatus("✅ Đã kích hoạt Workflow! Đang chờ Android 9 boot & cập nhật link...", "info");

            // 2. Kiểm tra lấy file android-link.txt tự động (quét mỗi 15 giây)
            let attempts = 0;
            const maxAttempts = 35; // Quét trong tầm 8 phút

            const checkInterval = setInterval(async () => {
                attempts++;
                showStatus(`⏳ Đang chờ máy ảo tạo link (Lần ${attempts}/${maxAttempts})... Khoảng 2-4 phút.`, "info");

                try {
                    const rawRes = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/android-link.txt?t=${Date.now()}`);
                    
                    if (rawRes.ok) {
                        const link = (await rawRes.text()).trim();
                        if (link && link.startsWith("http")) {
                            clearInterval(checkInterval);
                            showStatus("🎉 Android 9 đã sẵn sàng!", "success");
                            
                            const linkBox = document.getElementById("link-box");
                            const vncUrl = document.getElementById("vnc-url");
                            vncUrl.href = link;
                            vncUrl.innerText = link;
                            linkBox.style.display = "block";
                            btn.disabled = false;
                        }
                    }
                } catch (e) {
                    console.log("Đang chờ link...");
                }

                if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    showStatus("⚠️ Quá thời gian chờ. Bạn hãy kiểm tra lại tab Actions trên GitHub.", "error");
                    btn.disabled = false;
                }
            }, 15000);

        } catch (err) {
            showStatus(err.message, "error");
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
